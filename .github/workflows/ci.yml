name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Backend: Lint + Test (95% coverage enforced by pytest.ini)
  # ────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: panscience
          POSTGRES_PASSWORD: panscience
          POSTGRES_DB: panscience_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmagic1 libpq-dev

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite  # for in-memory test DB

      - name: Lint with ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ tests/ --output-format=github

      - name: Run tests with coverage
        working-directory: backend
        env:
          OPENAI_API_KEY: "sk-test-placeholder-not-used-in-tests"
          DATABASE_URL: "postgresql+asyncpg://panscience:panscience@localhost:5432/panscience_test"
          DATABASE_URL_SYNC: "postgresql://panscience:panscience@localhost:5432/panscience_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "test-secret-key-32-characters-long!!"
          ENVIRONMENT: "testing"
        run: |
          pytest --cov=app --cov-report=xml --cov-fail-under=95 -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Frontend: Lint + Jest Tests
  # ────────────────────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Run Jest tests
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false --ci

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Docker Build (runs on main branch only)
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Docker Compose Smoke Test
  # ────────────────────────────────────────────────────────────────────────────
  compose-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for smoke test
        run: |
          echo "OPENAI_API_KEY=sk-test-placeholder" > .env
          echo "SECRET_KEY=smoke-test-secret-key-32-chars!!" >> .env

      - name: Start services
        run: docker compose up -d --build postgres redis backend migrate
        env:
          OPENAI_API_KEY: sk-test-placeholder
          SECRET_KEY: smoke-test-secret-key-32-chars!!

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then
              echo "Backend is healthy!"
              break
            fi
            echo "Attempt $i/30 failed, retrying..."
            sleep 3
          done

      - name: Verify health endpoint response
        run: |
          response=$(curl -s http://localhost:8000/api/health)
          echo "Health response: $response"
          echo "$response" | grep -q '"status":"ok"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
