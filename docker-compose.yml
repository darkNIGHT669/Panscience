version: "3.9"

# ─── Shared Networks ──────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge

# ─── Persistent Volumes ───────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:        # shared between backend instances

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL with pgvector ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: panscience_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panscience
      POSTGRES_PASSWORD: panscience
      POSTGRES_DB: panscience
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"       # exposed for local dev / DB tools
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panscience -d panscience"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: panscience_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: panscience_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://panscience:panscience@postgres:5432/panscience
      DATABASE_URL_SYNC: postgresql://panscience:panscience@postgres:5432/panscience
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000","http://localhost"]'
      # Secrets — override with real values in .env or CI secrets
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32-characters!!}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app_network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Alembic Migrations (runs once then exits) ─────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: panscience_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://panscience:panscience@postgres:5432/panscience
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
    command: >
      sh -c "alembic upgrade head && echo 'Migrations complete'"
    networks:
      - app_network
    restart: "no"

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: panscience_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: ws://localhost/api
    networks:
      - app_network
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: panscience_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
